name: main

on:
  push:
    branches:
      - 3.x
  pull_request:

jobs:
  checks:
    name: PHP ${{ matrix.php }} | Tracy ${{ matrix.tracy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        tracy: ['with', 'without']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Remove Tracy
        if: matrix.tracy == 'without'
        run: composer remove --dev tracy/tracy --no-update

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: vendor/bin/tester tests -s -C

      - name: PHPStan
        if: matrix.tracy == 'with'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Print failed tests
        if: failure()
        run: for i in $(find tests -name \*.actual); do echo "--- $i"; cat $i; echo; echo; done
